<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registration complete')}"></head>
<body class="flex min-h-screen items-center justify-center bg-slate-50">
<main class="w-full max-w-lg rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="mb-6 text-2xl font-semibold text-slate-900">Account created</h1>

    <p class="mb-4 text-sm text-slate-700">Your tenant id: <span data-testid="tenant-id" th:text="${tenantId}" class="font-mono text-slate-900">tenant-id</span></p>

    <div class="mb-6 rounded-md border border-amber-200 bg-amber-50 px-4 py-3">
        <p class="text-sm text-amber-800">Your API token (shown only this once — store it somewhere safe):</p>
        <code data-testid="api-token" th:text="${apiToken}" class="mt-2 block break-all rounded border border-amber-200 bg-white px-3 py-2 font-mono text-sm text-slate-900">api-token</code>
    </div>

    <p><a href="/app/login" class="font-medium text-slate-900 hover:underline">Log in</a></p>
</main>
</body>
</html>
