<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body class="flex min-h-screen items-center justify-center bg-slate-50">
<main class="w-full max-w-sm rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="mb-6 text-2xl font-semibold text-slate-900">Log in</h1>

    <p th:if="${param.error}" class="mb-4 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">Invalid email or password.</p>

    <form th:action="@{/app/login}" method="post" class="space-y-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label class="block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Email</span>
            <input type="email" name="username" required
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"/>
        </label>
        <label class="block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Password</span>
            <input type="password" name="password" required
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"/>
        </label>
        <button type="submit" class="w-full rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800">Log in</button>
    </form>

    <p class="mt-6 text-sm text-slate-600">New here? <a href="/app/register" class="font-medium text-slate-900 hover:underline">Create an account</a></p>
</main>
</body>
</html>
