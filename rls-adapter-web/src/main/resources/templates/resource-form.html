<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${mode == 'edit'} ? 'Edit resource' : 'New resource')}"></head>
<body class="min-h-screen bg-slate-50">
<div th:replace="~{fragments/layout :: nav}"></div>

<main class="mx-auto max-w-xl px-6 py-10">
    <h1 class="mb-6 text-2xl font-semibold text-slate-900" th:text="${mode == 'edit'} ? 'Edit resource' : 'New resource'">Resource</h1>

    <p th:replace="~{fragments/layout :: error(${error})}"></p>

    <form th:action="${mode == 'edit'} ? @{/app/resources/{id}(id=${resourceId})} : @{/app/resources}" method="post"
          class="space-y-4 rounded-lg border border-slate-200 bg-white p-6">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <label class="block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Resource key</span>
            <input type="text" name="resourceKey" th:value="${resourceKey}" th:readonly="${mode == 'edit'}" required
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500 read-only:bg-slate-100"/>
        </label>

        <label class="block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Strategy</span>
            <select name="strategyType" required
                    class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500">
                <option th:each="strategy : ${strategies}"
                        th:value="${strategy}"
                        th:selected="${strategy.name() == strategyType}"
                        th:text="${strategy}">STRATEGY</option>
            </select>
        </label>

        <label class="block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Limit</span>
            <input type="number" name="limit" th:value="${limit}" min="1" required
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"/>
        </label>
        <label class="block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Window (seconds)</span>
            <input type="number" name="windowSeconds" th:value="${windowSeconds}" min="1" required
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"/>
        </label>
        <label class="block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Burst capacity (optional)</span>
            <input type="number" name="burstCapacity" th:value="${burstCapacity}" min="1"
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"/>
        </label>

        <button type="submit" th:text="${mode == 'edit'} ? 'Save' : 'Create'"
                class="w-full rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800">Save</button>
    </form>
</main>
</body>
</html>
