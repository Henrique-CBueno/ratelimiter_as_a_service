<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title th:text="${mode == 'edit'} ? 'Edit resource' : 'New resource'">Resource</title></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<h1 th:text="${mode == 'edit'} ? 'Edit resource' : 'New resource'">Resource</h1>

<p th:replace="~{fragments/layout :: error(${error})}"></p>

<form th:action="${mode == 'edit'} ? @{/app/resources/{id}(id=${resourceId})} : @{/app/resources}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <label>Resource key
        <input type="text" name="resourceKey" th:value="${resourceKey}" th:readonly="${mode == 'edit'}" required/>
    </label>

    <label>Strategy
        <select name="strategyType" required>
            <option th:each="strategy : ${strategies}"
                    th:value="${strategy}"
                    th:selected="${strategy.name() == strategyType}"
                    th:text="${strategy}">STRATEGY</option>
        </select>
    </label>

    <label>Limit <input type="number" name="limit" th:value="${limit}" min="1" required/></label>
    <label>Window (seconds) <input type="number" name="windowSeconds" th:value="${windowSeconds}" min="1" required/></label>
    <label>Burst capacity (optional) <input type="number" name="burstCapacity" th:value="${burstCapacity}" min="1"/></label>

    <button type="submit" th:text="${mode == 'edit'} ? 'Save' : 'Create'">Save</button>
</form>
</body>
</html>
