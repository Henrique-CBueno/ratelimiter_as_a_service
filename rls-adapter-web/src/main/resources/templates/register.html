<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Register</title></head>
<body>
<h1>Create your account</h1>

<p th:replace="~{fragments/layout :: error(${error})}"></p>

<form th:action="@{/app/register}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label>Name <input type="text" name="name" th:value="${name}" required/></label>
    <label>Email <input type="email" name="email" th:value="${email}" required/></label>
    <label>Password <input type="password" name="password" required/></label>
    <button type="submit">Register</button>
</form>

<p>Already have an account? <a href="/app/login">Log in</a></p>
</body>
</html>
