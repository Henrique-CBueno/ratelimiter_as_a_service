<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body class="flex min-h-screen items-center justify-center bg-slate-50">
<main class="w-full max-w-sm rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="mb-6 text-2xl font-semibold text-slate-900">Create your account</h1>

    <p th:replace="~{fragments/layout :: error(${error})}"></p>

    <form th:action="@{/app/register}" method="post" class="space-y-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label class="block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Name</span>
            <input type="text" name="name" th:value="${name}" required
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"/>
        </label>
        <label class="block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Email</span>
            <input type="email" name="email" th:value="${email}" required
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"/>
        </label>
        <label class="block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Password</span>
            <input type="password" name="password" required
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"/>
        </label>
        <button type="submit" class="w-full rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800">Register</button>
    </form>

    <p class="mt-6 text-sm text-slate-600">Already have an account? <a href="/app/login" class="font-medium text-slate-900 hover:underline">Log in</a></p>
</main>
</body>
</html>
