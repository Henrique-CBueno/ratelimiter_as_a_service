global:
  scrape_interval: 15s

scrape_configs:
  # Discovers every running `app` replica via Docker's embedded DNS — a scaled Compose service's
  # name resolves to one A record per replica, re-resolved on each refresh, so scaling with
  # `--scale app=N` is picked up automatically without editing this file.
  - job_name: app
    dns_sd_configs:
      - names: ["app"]
        type: A
        port: 8080
        refresh_interval: 15s
    metrics_path: /actuator/prometheus

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]
    metrics_path: /metrics
